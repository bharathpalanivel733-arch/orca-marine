# Root mypy configuration.
#
# Like pytest.ini, this exists because checks run from the repo root across several
# packages, where per-package [tool.mypy] blocks are not all picked up.
[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True

# boto3/botocore ship no py.typed marker. Their absence of stubs is not a defect in
# ORCA's code, and installing boto3-stubs across every service is not worth the weight
# for the handful of calls the object store makes.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-truststore.*]
ignore_missing_imports = True

[mypy-s3fs.*]
ignore_missing_imports = True
