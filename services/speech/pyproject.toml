[project]
name = "orca-speech"
version = "0.1.0"
description = "ORCA multilingual voice I/O: ASR, deterministic templating, TTS, audio cache."
requires-python = ">=3.12"
# No model runtime and no HTTP client in the core. Language detection, templating, number
# normalization and cache keys are pure Python, so the part of the speech path that must
# never drift is testable offline and identical on every machine.
dependencies = ["orca-schemas"]

[project.optional-dependencies]
# Object-store backed audio cache (MinIO in dev, S3 in production).
cache = ["boto3>=1.35"]
# Self-hosted IndicWhisper / Indic-Parler-TTS. Heavy, GPU-oriented, and not installed by
# default: the fallback chain reports these providers unavailable without them, which is
# the behaviour CI actually exercises.
selfhosted = ["transformers>=4.44", "torch>=2.4", "soundfile>=0.12"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrors the root pytest.ini so running this package directly deselects the opt-in suites
# too; an explicit -m on the command line still overrides it.
addopts = "-m 'not stack and not live and not model'"
markers = [
    "stack: requires the local docker-compose dev stack",
    "live: makes real network calls to upstream data sources",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# The language and template catalogues are data tables. Ruff's formatter would reflow the
# aligned marker lists into one word per line, which makes them unreadable to review.
"orca_speech/detect.py" = ["E501"]
