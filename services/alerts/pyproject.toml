[project]
name = "orca-alerts"
version = "0.1.0"
description = "ORCA proactive alert subsystem: scheduled risk evaluation, CAP 1.2, delivery, audit."
requires-python = ">=3.12"
# The rules that decide whether to wake a fisherman depend on the vessel thresholds
# (kernels), the treaty boundary (geo), the alert wording (speech) and the provenance graph
# (trust) — and on no model runtime and no scheduler framework. Cadence is a deployment
# concern; the evaluation is a pure function of its inputs and an explicit clock.
dependencies = [
  "orca-schemas",
  "orca-kernels",
  "orca-geo",
  "orca-speech",
  "orca-trust",
]

[project.optional-dependencies]
# Live push transports. Absent by default: every channel reports itself unconfigured
# without credentials, which is the branch the tests exercise.
push = ["pywebpush>=2.0", "google-auth>=2.35"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_alerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrors the root pytest.ini so running this package directly deselects the opt-in suites
# too; an explicit -m on the command line still overrides it.
addopts = "-m 'not stack and not live and not model'"
markers = [
    "stack: requires the local docker-compose dev stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
