[project]
name = "orca-kernels"
version = "0.1.0"
description = "ORCA deterministic decision kernels: safety score, Pareto zones, routing, anomalies."
requires-python = ">=3.12"
# Deliberately dependency-light. These kernels are arithmetic over evidence records and
# must stay runnable, auditable and fast without a model runtime anywhere near them.
dependencies = ["orca-schemas", "typing-extensions>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
