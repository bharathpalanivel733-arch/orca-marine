[project]
name = "orca-ingest"
version = "0.1.0"
description = "ORCA ingest service: source adapters emitting the common record contract."
requires-python = ">=3.12"
dependencies = [
  "orca-schemas",
  "structlog>=24.4",
  "httpx>=0.27",
  # Several Indian government hosts serve an incomplete certificate chain; OpenSSL
  # cannot fetch the missing intermediate but the OS can. See scripts/spikes/README.md.
  "truststore>=0.9",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
# Gridded-field persistence (Zarr). Optional: the ingest core runs without it.
grids = ["xarray>=2024.6", "zarr>=3.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
