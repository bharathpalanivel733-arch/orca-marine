[project]
name = "orca-ingest"
version = "0.1.0"
description = "ORCA ingest service. Phase 0: package scaffold only."
requires-python = ">=3.12"
dependencies = ["orca-schemas", "structlog>=24.4"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
