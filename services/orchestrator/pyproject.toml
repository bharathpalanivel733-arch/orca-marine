[project]
name = "orca-orchestrator"
version = "0.1.0"
description = "ORCA agentic orchestration: typed state, validated DAG, budgets, replanning."
requires-python = ">=3.12"
dependencies = [
  "orca-schemas",
  "orca-kernels",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
# LangGraph is the preferred engine (ARCHITECTURE.md section 2); the DagEngine fallback
# runs the same nodes without it, so the core has no hard dependency on it.
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
