# Root pytest configuration.
#
# `pnpm test` runs ONE pytest session across every package from the repo root, so the
# rootdir is here and the per-package [tool.pytest.ini_options] blocks are not read.
# Async adapter tests need asyncio auto mode in that session too, otherwise pytest
# reports "async def functions are not natively supported" and the tests fail.
[pytest]
asyncio_mode = auto
# Opt-in suites. Default runs exclude them so the normal suite is hermetic and offline.
#   pytest -m stack   -> needs the docker-compose dev stack (TimescaleDB, MinIO)
#   pytest -m live    -> makes real network calls to keyless upstream endpoints
addopts = -m "not stack and not live"
markers =
    stack: requires the local docker-compose dev stack
    live: makes real network calls to upstream data sources
testpaths =
    packages/schemas/tests
    services/api/tests
    services/agents/tests
    services/ingest/tests
